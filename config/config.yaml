env: prod
agent_id: ""                       # required: stable identity of this node, set via deploy.sh

storage:
  path: /var/lib/skywalker-agent/agent.db
  busy_timeout: 5s
  wal: true
  synchronous_full: false
  foreign_keys: true

driver_xray:
  api_addr: 127.0.0.1:10085        # xray gRPC API address (proxyman/stats)
  inbound_tag: vless-in
  op_timeout: 5s
  flow: xtls-rprx-vision
  level: 0

  # REALITY client-facing params used to build VLESS URI for control-plane.
  # All four below are filled by deploy.sh on the host.
  public_host: ""                  # routable address of this node (IP or domain)
  port: 443
  sni: ""                          # fake SNI domain (REALITY serverNames[0])
  public_key: ""                   # REALITY x25519 public key
  short_id: ""                     # REALITY shortId (hex)
  fingerprint: chrome

transport:
  address: ""                      # required: host:port of control plane
  region: ""                       # ISO alpha-2 country code, optional
  version: ""                      # build version, optional

  send_queue_size: 128
  reconnect_min: 1s
  reconnect_max: 60s
  dial_timeout: 5s

worker:
  task_poll_interval: 1s
  stats_interval: 30s
  sync_interval: 1m
  task_batch_limit: 32
